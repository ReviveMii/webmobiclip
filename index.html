<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>WebMobiClip Player | ReviveMii</title>
  <link rel="stylesheet" href="https://revivemii.xyz/assets/css/main.css">
  <style>
    .hero { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 40px 20px 20px; 
      min-height: auto; 
    }
    .hero h1 { 
      font-size: 2rem; 
      text-align: center; 
      margin-bottom: 20px;
    }
    .container { 
      max-width: 960px; 
      margin: 0 auto 60px; 
      padding: 0 20px; 
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }
    .btn {
      background: #1f1f1f;
      color: #00c2ff;
      border: 1px solid #2c2c2c;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .btn:hover {
      background: #2c2c2c;
      border-color: #00c2ff;
      color: #0094cc;
    }
    .btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .player-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #1f1f1f;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #2c2c2c;
    }
    .player-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>WebMobiClip by ReviveMii</h1>
  </section>

  <div class="container">
    <div class="controls">
      <button class="btn" id="btnExample">
        <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        Show Example Video
      </button>

      <button class="btn" id="btnPlayer">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
        Show Player
      </button>

      <a class="btn" href="./player.html" target="_blank" id="btnNewTab">
        <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        Open Player in New Tab
      </a>
      <a class="btn" href="./sourcecode/latest/webmobiclip.zip" target="_blank" id="btnNewTab">
        <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        Source Code
      </a>
    </div>

    <div class="player-wrapper">
      <iframe id="playerIframe" src="./player.html" title="WebMobiClip Player"></iframe>
    </div>
  </div>

  <script>
    const iframe = document.getElementById('playerIframe');
    const btnExample = document.getElementById('btnExample');
    const btnPlayer = document.getElementById('btnPlayer');
    btnExample.addEventListener('click', () => {
      iframe.src = `./player.html?url=${encodeURIComponent("./wii-plus-internet-americanenglish.mo")}`;
    });
    btnPlayer.addEventListener('click', () => {
      iframe.src = "./player.html";
    });
  </script>
  <script src="https://assetscdn.revivemii.xyz/misc/wii/cursor.js"></script>
</body>
</html>
